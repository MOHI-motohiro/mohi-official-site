name: Deploy website to AWS

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy index.html
        run: |
          scp index.html \
          ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:/var/www/mohi.co.jp/index.html

      - name: Deploy assets
        run: |
          if [ -d "assets" ]; then
            scp -r assets/* \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:/var/www/mohi.co.jp/assets/
          fi
